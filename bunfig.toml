[test]
preload = ["./tests/preload.ts"]
# Coverage floor enforced by `bun test --coverage` (used in CI).
# Regression floor; the suite covers approximately 84% lines / 80% functions.
# Explicit per-metric keys: a bare number also enforces statement coverage,
# which Bun >= 1.3.14 evaluates and fails despite lines/functions passing.
coverageThreshold = { line = 0.8, function = 0.75 }
