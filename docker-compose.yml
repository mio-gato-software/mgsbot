services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      # The app re-reads ./.env at startup (loadEnvIntoProcess in index.ts),
      # so the bind mount is the single source of env config; `env_file`
      # would be redundant with it.
      - ./.env:/app/.env:ro
      - ./memory:/app/memory
      - ./audios:/app/audios
      - ./logs:/app/logs
    # Liveness is inherited from the HEALTHCHECK instruction in the Dockerfile.
