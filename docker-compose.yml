services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./memory:/app/memory
      - ./audios:/app/audios
      - ./logs:/app/logs
    healthcheck:
      # The bot touches /tmp/mgsbot-heartbeat every 30s while its event loop
      # is alive; consider it unhealthy if the file goes stale for >2 minutes.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const t = Number(await Bun.file('/tmp/mgsbot-heartbeat').text()); process.exit(Date.now() - t < 120_000 ? 0 : 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1m
